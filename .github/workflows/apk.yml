# Compila el APK de Android en GitHub (sin instalar Android Studio).
# Descárgalo en: Actions → "APK Android" → la ejecución → Artifacts → centinela-apk
# Al crear un tag vX.Y.Z, además se adjunta al Release.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths: ['app/**', '.github/workflows/apk.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependencias
        run: npm ci
      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK release
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk centinela.apk
      - uses: actions/upload-artifact@v4
        with:
          name: centinela-apk
          path: app/centinela.apk
          retention-days: 30
      - name: Adjuntar al Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/centinela.apk
