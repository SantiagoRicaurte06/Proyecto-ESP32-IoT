<rect x="80.0" y="690.0" width="1140.0" height="390.0" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
<text x="100.0" y="720.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Ubicación de componentes</text>
<text x="100.0" y="746.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">1  Servo SG90 con brazo de balso rojo y blanco: barrera del puente</text>
<text x="100.0" y="766.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">2  IR de obstáculos a 2 cm de la vía, apuntando al carril (detecta carros)</text>
<text x="100.0" y="786.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">3  Poste del semáforo: LED rojo arriba y LED verde abajo</text>
<text x="100.0" y="806.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">4  HC-SR04 mirando hacia abajo a 23 cm del fondo (ALTURA_SENSOR_CM)</text>
<text x="100.0" y="826.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">5  DHT11 en el mástil; ESP32 y protoboard dentro de la caja</text>
<text x="100.0" y="846.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">6  PIR en poste de 6 cm apuntando a la ribera (personas en riesgo)</text>
<text x="100.0" y="866.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">7  Humedad de suelo clavado en la bandeja de tierra (10 × 10 cm)</text>
<text x="660.0" y="720.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Materiales</text>
<text x="660.0" y="746.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• MDF 3 mm: tapa 60×40, frente y fondo 60×15, laterales 40×15</text>
<text x="660.0" y="766.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Recipiente plástico transparente ~30×15×15 cm (o acrílico 3 mm)</text>
<text x="660.0" y="786.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Cartón paja: vía, viviendas y acabados · palos de balso: postes</text>
<text x="660.0" y="806.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Pintura acrílica (verde, gris vía) y regla en cm impresa para el río</text>
<text x="660.0" y="826.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Jarra para la creciente + manguera con pinza o jeringa para vaciar</text>
<text x="660.0" y="846.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Silicona caliente, tornillos M3, cinta doble faz, bridas, protoboard</text>
<text x="660.0" y="866.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Cargador 5 V / 2 A con cable cortado + condensador de 470 µF</text>
<text x="100.0" y="912.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Recomendaciones</text>
<text x="100.0" y="938.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Sella el recipiente con silicona: el agua NUNCA debe llegar al compartimiento de electrónica.</text>
<text x="100.0" y="958.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Los cables de los sensores de la tapa bajan por agujeros de 8 mm junto a cada poste.</text>
<text x="100.0" y="978.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Deja el USB del ESP32 accesible por la puerta trasera para reprogramar (o actualiza por WiFi con OTA).</text>
<text x="100.0" y="998.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• En la demo: vierte agua poco a poco (sube la alerta) y vacía con la manguera (baja con histéresis).</text>
<text x="100.0" y="1018.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">• Si las lecturas del HC-SR04 saltan, pon un disco de icopor flotando bajo el sensor.</text>
</svg>