<text x="100.0" y="814.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Alimentación</text>
<text x="100.0" y="836.0" font-size="12" fill="#374151" text-anchor="start" font-weight="400">• ESP32 por USB (computador o power bank). El pin 3V3 alimenta OLED, DHT11, táctil, IR y humedad de suelo (así su salida nunca pasa de 3,3 V).</text>
<text x="100.0" y="854.0" font-size="12" fill="#374151" text-anchor="start" font-weight="400">• Fuente externa 5 V / 2 A (cargador de celular) al riel de 5 V: servo, relé, HC-SR04 y PIR. Condensador de 470–1000 µF en el riel. GND común con el ESP32.</text>
<text x="100.0" y="872.0" font-size="12" fill="#374151" text-anchor="start" font-weight="400">• Relé activo en BAJO (la mayoría): RELE_ACTIVO_EN_ALTO = false en config.h. La sirena es un buzzer de 5 V o una baliza LED en COM / NO.</text>
